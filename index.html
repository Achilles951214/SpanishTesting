<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Conjuga — Spanish Verb Practice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="title-block">
      <h1>Conjuga</h1>
      <span id="version" class="version"></span>
    </div>
    <div class="header-controls">
      <button id="back-btn" class="icon-btn" aria-label="Back to previous sentence" disabled>Back</button>
      <button id="pause-btn" class="icon-btn" aria-label="Pause">Pause</button>
    </div>
  </header>

  <main class="card">
    <div class="card-row">
      <span class="label">English</span>
      <span id="timer" class="timer">0.0s</span>
    </div>
    <p id="english-text" class="sentence"></p>

    <div class="divider"></div>

    <div id="spanish-block" class="hidden">
      <span class="label">Español</span>
      <p id="spanish-text" class="sentence spanish"></p>
      <div class="tag-row">
        <p id="tag-text" class="tag-reveal"></p>
        <button id="flag-btn" class="flag-btn">Flag to repeat</button>
      </div>
      <p id="note-text" class="note hidden"></p>
    </div>
    <p id="hint-text" class="hint">Tap "Show Spanish" when ready.</p>
  </main>

  <button id="action-btn" class="primary-btn">Show Spanish</button>

  <div id="pause-overlay" class="overlay hidden">
    <div class="prompt-card">
      <div class="prompt-title">Paused</div>
      <p class="prompt-body">Take your time. Tap resume when you're ready to keep going.</p>
      <button id="resume-btn" class="primary-btn">Resume</button>
    </div>
  </div>

</div>
<script type="module" src="js/app.js"></script>
<script>
  // A home-screen PWA is usually resumed from a frozen background tab, not a
  // fresh navigation, so it can sit on a stale service worker indefinitely
  // unless something actively checks. This checks on load and whenever the
  // app comes back to the foreground, then reloads once the new one takes over.
  if ('serviceWorker' in navigator) {
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').then((reg) => {
        reg.update();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
        window.addEventListener('focus', () => reg.update());
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
